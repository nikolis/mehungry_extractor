[project]
name = "mehungry-extractor"
version = "0.1.0"
description = "Offline phase-aware recommendation extractor for Mehungry. Pulls condition/study pairs from the deployed app, fetches PubMed/PMC text, extracts phase-tagged dietary recommendations with an LLM (optionally grounded by biomedical NER), and posts review-gated candidates back over the token-guarded REST API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "anthropic>=0.40",
    "pydantic>=2.6",
]

# Optional biomedical NER grounding (scispaCy). Heavy — install only on the GPU/NLP box:
#   uv pip install -e '.[ner]'
#   python -m spacy download en_ner_bc5cdr_md   # or the scispaCy model wheel
[project.optional-dependencies]
ner = [
    "scispacy>=0.5.4",
    "spacy>=3.7",
]

[project.scripts]
mehungry-extract = "mehungry_extractor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mehungry_extractor"]
