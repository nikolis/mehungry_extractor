[project]
name = "mehungry-extractor"
version = "0.2.0"
description = "Deterministic, offline biomedical literature ingestion and evidence/provenance engine for Mehungry, plus the legacy LLM recommendation extractor. Archives PubMed/PMC sources immutably, builds an offset-addressable canonical document, and preserves complete provenance back to the exact source span."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "anthropic>=0.40",
    "pydantic>=2.6",
    "spacy>=3.7",
    "sqlalchemy>=2.0",
]

# Optional biomedical NER grounding (scispaCy). Heavy — install only on the GPU/NLP box:
#   uv pip install -e '.[ner]'
#   python -m spacy download en_ner_bc5cdr_md   # or the scispaCy model wheel
[project.optional-dependencies]
ner = [
    "scispacy>=0.5.4",
    "spacy>=3.7",
]

[project.scripts]
mehungry-extract = "mehungry_extractor.cli:main"          # legacy LLM recommendation path
mehungry = "mehungry_extractor.knowledge.stagecli:main"   # deterministic staged engine

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mehungry_extractor"]
